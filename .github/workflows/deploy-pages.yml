name: Validar y publicar en GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener código
        uses: actions/checkout@v6
      - name: Preparar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Instalar dependencias reproducibles
        run: npm ci
      - name: Evitar claves privadas en el sitio
        run: |
          test ! -f .env
          ! rg --glob '*.js' --glob '*.html' 'sb_secret_' .
      - name: Validar JavaScript
        run: npm run check
      - name: Ejecutar pruebas unitarias
        run: npm run test:unit
      - name: Construir sitio público mínimo
        run: npm run build
      - name: Instalar navegador de pruebas
        run: npx playwright install --with-deps chromium
      - name: Probar escritorio, iPhone y Android
        run: npm run test:e2e
      - name: Guardar informe si una prueba falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Obtener código
        uses: actions/checkout@v6
      - name: Preparar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Instalar dependencias reproducibles
        run: npm ci
      - name: Crear configuración pública de Supabase
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_PUBLISHABLE_KEY"
          node -e "const fs=require('fs'); const config={url:process.env.SUPABASE_URL,publishableKey:process.env.SUPABASE_PUBLISHABLE_KEY}; fs.writeFileSync('supabase-client-config.js','window.LUX_SUPABASE_CONFIG = Object.freeze(' + JSON.stringify(config) + ');\\n');"
      - name: Construir sitio público mínimo
        run: npm run build
      - name: Configurar Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Preparar sitio estático
        uses: actions/upload-pages-artifact@v4
        with:
          path: .site
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
