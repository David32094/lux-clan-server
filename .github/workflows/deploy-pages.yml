name: Validar y publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener código
        uses: actions/checkout@v6
      - name: Validar scripts del hub
        run: |
          node --check prototipo-lider.js
          node --check prototipo-clan-hub.js
          node --check prototipo-accesos.js
          node --check prototipo-placas.js
          node --check prototipo-supabase.js
      - name: Evitar claves privadas en el sitio
        run: |
          test ! -f .env
          ! rg --glob '*.js' --glob '*.html' 'sb_secret_' .

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Obtener código
        uses: actions/checkout@v6
      - name: Configurar Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Create public Supabase configuration
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_PUBLISHABLE_KEY"
          node -e "const fs=require('fs'); const config={url:process.env.SUPABASE_URL,publishableKey:process.env.SUPABASE_PUBLISHABLE_KEY}; fs.writeFileSync('supabase-client-config.js','window.LUX_SUPABASE_CONFIG = Object.freeze(' + JSON.stringify(config) + ');\\n');"
      - name: Preparar sitio estático
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
