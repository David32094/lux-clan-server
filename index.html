  <meta charset="utf-8"/>

<body>
  <p>Abriendo el editor… <a href="./LUX_CLAN_EDITOR_BY.DAVID.XIT.html">Abrir ahora</a></p>
  <script>
    (async () => {
      const editor = './LUX_CLAN_EDITOR_BY.DAVID.XIT.html';
      if ('serviceWorker' in navigator && window.isSecureContext) {
        try {
          const registration = await navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' });
          await registration.update();
          const worker = registration.installing || registration.waiting;
          if (worker && worker.state !== 'activated') {
            await new Promise(resolve => {
              worker.addEventListener('statechange', () => {
                if (worker.state === 'activated' || worker.state === 'redundant') resolve();
              });
              setTimeout(resolve, 3500);
            });
          }
        } catch (_) {}
      }
      location.replace(editor);
    })();
  </script>
  <noscript><meta http-equiv="refresh" content="0; url=./LUX_CLAN_EDITOR_BY.DAVID.XIT.html"/></noscript>
</body>
